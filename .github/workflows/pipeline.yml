name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'tourism_project/data/**'
      - 'tourism_project/model_building/**'
      - 'tourism_project/deployment/**'
      - 'tourism_project/requirements.txt'
      - '.github/workflows/pipeline.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-mlops-pipeline
  cancel-in-progress: false

jobs:

  register-dataset:

    name: Register Dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:

    name: Data Preparation

    needs: register-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Run Data Preparation
        run: >-
          python tourism_project/model_building/prep.py
          --data tourism_project/data/tourism.csv
          --output-dir tourism_project/data/splits

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/splits/train.csv
            tourism_project/data/splits/test.csv


  model-training:

    name: Model Training and MLflow Tracking

    needs: data-prep

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r tourism_project/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/splits

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          sleep 5

      - name: Model Building
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python tourism_project/model_building/train.py \
            --splits-dir tourism_project/data/splits \
            --model-dir tourism_project/deployment

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/
          git commit -m "Update trained tourism model [skip ci]" || echo "No changes to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
