name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'tourism_project/data/**'
      - 'tourism_project/model_building/**'
      - 'tourism_project/deployment/**'
      - 'tourism_project/requirements.txt'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write
  
concurrency:
  group: tourism-mlops-pipeline
  cancel-in-progress: false

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        run: |
          python tourism_project/model_building/prep.py \
              --data tourism_project/data/tourism.csv \
              --output-dir tourism_project/data/splits
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/splits/train.csv
            tourism_project/data/splits/test.csv

  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          ref: main
          fetch-depth: 0
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server starts
      - name: Model Building
        run: |
          python tourism_project/model_building/train.py \
            --splits-dir tourism_project/data/splits \
            --model-dir tourism_project/deployment
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/   # path to the saved model file
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
